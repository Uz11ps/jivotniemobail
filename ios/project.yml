name: DetiZhivotnieApp
options:
  bundleIdPrefix: com.detizhivotnie
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.18.0
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: 4.3.0

targets:
  DetiZhivotnieApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DetiZhivotnieApp/DetiZhivotnieAppApp.swift
      - path: DetiZhivotnieApp/ContentView.swift
      - path: DetiZhivotnieApp/Sources
      - path: DetiZhivotnieApp/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.detizhivotnie.DetiZhivotnieApp
        INFOPLIST_FILE: DetiZhivotnieApp/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Дети и Животные
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseFunctions
      - package: Lottie
        product: Lottie
